name: Update 70-NPC World State

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run 70-NPC world simulation (4 hours)
        run: |
          python sim/run_sim.py --data-dir sim/data --state-file sim/npc_state.json --out world_state.json --ticks 4

      - name: Commit and push updated world_state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world_state.json sim/npc_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(sim): update 70-NPC world_state.json"
            git push
          fi
